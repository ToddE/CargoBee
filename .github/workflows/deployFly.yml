name: Deploy to Fly.io

# Runs only when a tag starting with "v" is pushed, and only if the tests pass.
on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    concurrency: deploy-fly
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - name: Deploy, setting APP_VERSION from the tag
        run: flyctl deploy --remote-only --env APP_VERSION=${{ github.ref_name }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
